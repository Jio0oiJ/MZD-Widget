plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mzdwidget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.mzdwidget'
        minSdk 24
        targetSdk 34
        versionCode 58
        versionName '1.9.29'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 核心逻辑不依赖第三方库；网络用 JDK 的 HttpURLConnection，
    // MD5/AES 用 javax.crypto，JSON 用内置 Org.json。
    // v1.9.25：小米穿戴互联 SDK（手环控车透传）。闭源 AAR 随工程附带，
    // 仅用于 system.interconnect 与手环 rpk 双向通信，无任何网络权限请求。
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}
